# coturn for anonimMessager calls. See server/README.md, section «Звонки».
# Clients always relay media through this server (RingRTC hideIp), so peers
# never see each other's IP. Media is SRTP end-to-end: coturn only forwards
# ciphertext.

listening-port=3478
# TURN over TLS for networks that block UDP. 443 gets through most firewalls;
# use 5349 if 443 is taken on this host.
tls-listening-port=443
cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-tlsv1
no-tlsv1_1

realm=turn.example.com
fingerprint

# Short-lived credentials issued by the relay (GET /v1/turn). Must equal the
# contents of the relay's -turn-secret-file.
use-auth-secret
static-auth-secret=CHANGE_ME

# Never relay into private / local networks (prevents using the server to
# reach internal services).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-tcp-relay

# Abuse limits: allocations per credential and in total.
user-quota=4
total-quota=400
stale-nonce=600

no-cli
# No logs at all: by default coturn writes client IPs and session details.
log-file=/dev/null
no-stdout-log
