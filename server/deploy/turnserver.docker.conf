# Template for docker-compose: init.sh fills in __SECRET__ and __EXTERNAL_IP__
# and writes secrets/turnserver.conf. Production notes: turnserver.conf.

listening-port=3478
listening-ip=0.0.0.0
# The relayed addresses handed to clients. RingRTC refuses relay candidates
# on private addresses, so this must be the server's public IPv4. Behind
# provider NAT it is "public/private": without the mapping coturn relays via
# the private address, which denied-peer-ip below then forbids (403), and
# calls fail with connectionFailure.
external-ip=__EXTERNAL_IP__
min-port=49160
max-port=49999

realm=calc
fingerprint
use-auth-secret
static-auth-secret=__SECRET__

no-tls
no-dtls
no-tcp-relay
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

user-quota=4
total-quota=400
stale-nonce=600

log-file=/dev/null
no-stdout-log
