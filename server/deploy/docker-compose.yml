# Whole server side: relay + TLS (Caddy) + TURN (coturn).
#   ./init.sh relay.example.com     # once: secrets, .env, coturn config
#   docker compose up -d --build
#
# Nothing logs: relay prints no requests, Caddy writes no access logs and
# Docker keeps no container output (logging driver "none").
#
# Works with Docker and with Podman (`systemctl enable --now podman.socket`).
# Bind mounts carry `z` so SELinux hosts (RHEL, Rocky, Alma, Fedora) relabel
# them for container access; elsewhere the flag is ignored.

x-nolog: &nolog
  logging:
    driver: none

services:
  relay:
    build: ..
    image: calc-relay
    restart: unless-stopped
    <<: *nolog
    command:
      - -turn-secret-file=/run/secrets/turn-secret
      - -turn-urls=turn:${PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp
    volumes:
      - relay-data:/data
      # A plain bind mount rather than compose `secrets:`, which can't take
      # the SELinux label option.
      - ./secrets/turn-secret:/run/secrets/turn-secret:ro,z
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [internal]

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    <<: *nolog
    depends_on: [relay]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Host networking: coturn needs the real public IP and a large UDP port
  # range, which Docker's port mapping handles badly.
  coturn:
    image: docker.io/coturn/coturn:4
    restart: unless-stopped
    <<: *nolog
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./secrets/turnserver.conf:/etc/coturn/turnserver.conf:ro,z

volumes:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  internal:
